# פרסום האתר בחינם ב-GitHub Pages בכל עדכון של הענף הראשי
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # בניית דפי השפות (/ar/, /ru/) מתוך הדף העברי והתרגומים בתיקיית i18n
      - name: Build language pages
        run: node tools/build-i18n.js
      # מספר גרסה בקישורים לקבצים, כדי שדפדפנים יטענו את הגרסה החדשה אחרי עדכון
      - name: Cache-bust assets
        run: |
          v="${GITHUB_SHA::7}"
          for f in index.html */index.html; do
            sed -i -E "s#(css/style\.css|js/[a-z0-9-]+\.js)\"#\1?v=$v\"#g" "$f"
            echo "$f: $(grep -c "?v=$v" "$f")"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
