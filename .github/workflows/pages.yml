# פרסום האתר בחינם ב-GitHub Pages בכל עדכון של הענף הראשי
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # מספר גרסה בקישורים לקבצים, כדי שדפדפנים יטענו את הגרסה החדשה אחרי עדכון
      - name: Cache-bust assets
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(css/style\.css|js/[a-z]+\.js)\"#\1?v=$v\"#g" index.html
          grep -c "?v=$v" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
